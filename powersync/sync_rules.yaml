# ==============================================================================
# POWERSYNC SYNC RULES DEFINITION
# ==============================================================================
# Defines dynamic data streams replicating from Supabase PostgreSQL to client SQLite.

bucket_definitions:
  # 1. User Personal Stream (Profile, Personal Tags, Habits, Owned Projects)
  user_personal:
    parameters: 
      - SELECT request.user_id() as current_user_id
    data:
      - SELECT * FROM profiles WHERE id = current_user_id
      - SELECT * FROM tags WHERE user_id = current_user_id AND deleted_at IS NULL
      - SELECT * FROM habits WHERE user_id = current_user_id AND deleted_at IS NULL
      - SELECT * FROM habit_logs WHERE habit_id IN (SELECT id FROM habits WHERE user_id = current_user_id)
      - SELECT * FROM projects WHERE owner_id = current_user_id AND deleted_at IS NULL
      - SELECT * FROM focus_sessions WHERE user_id = current_user_id
      - SELECT * FROM saved_filters WHERE user_id = current_user_id AND deleted_at IS NULL

  # 2. Collaborative Workspace Stream (Shared Projects, Sections, Tasks, Comments, Attachments)
  collaborative_projects:
    parameters:
      - SELECT project_id FROM project_members WHERE user_id = request.user_id()
    data:
      - SELECT * FROM projects WHERE id = bucket.project_id AND deleted_at IS NULL
      - SELECT * FROM project_members WHERE project_id = bucket.project_id
      - SELECT * FROM sections WHERE project_id = bucket.project_id AND deleted_at IS NULL
      - SELECT * FROM tasks WHERE project_id = bucket.project_id AND deleted_at IS NULL
      - SELECT * FROM task_tags WHERE task_id IN (SELECT id FROM tasks WHERE project_id = bucket.project_id)
      - SELECT * FROM comments WHERE task_id IN (SELECT id FROM tasks WHERE project_id = bucket.project_id) AND deleted_at IS NULL
      - SELECT * FROM attachments WHERE task_id IN (SELECT id FROM tasks WHERE project_id = bucket.project_id) AND deleted_at IS NULL
