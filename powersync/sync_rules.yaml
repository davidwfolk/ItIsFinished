# ==============================================================================
# POWERSYNC SYNC RULES DEFINITION
# ==============================================================================
# Defines dynamic data streams replicating from Supabase PostgreSQL to client SQLite.

bucket_definitions:
  # 1. User Personal Stream (Profile, Time Blocks, Focus Sessions)
  user_personal:
    parameters: 
      - SELECT request.user_id() as current_user_id
    data:
      - SELECT * FROM profiles WHERE id = bucket.current_user_id

  # 2. Workspace Metadata Stream (Lightweight structure for ALL authorized workspaces to enable offline switching)
  workspace_metadata:
    parameters:
      - SELECT workspace_id FROM workspace_members WHERE user_id = request.user_id()
    data:
      - SELECT * FROM workspaces WHERE id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM workspace_members WHERE workspace_id = bucket.workspace_id
      - SELECT * FROM projects WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM sections WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM tags WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM habits WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM saved_filters WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL

  # 3. Workspace Deep Data Stream (Heavy data ONLY for the active workspace to prevent bloat)
  workspace_deep_data:
    parameters:
      # Reads the active_workspace_id from the user's JWT metadata
      - SELECT request.jwt_claim('user_metadata')->>'active_workspace_id' as active_id
        WHERE request.jwt_claim('user_metadata')->>'active_workspace_id' IS NOT NULL
        -- Security check: Ensure they are actually a member of this active workspace
        AND EXISTS (SELECT 1 FROM workspace_members WHERE workspace_id = (request.jwt_claim('user_metadata')->>'active_workspace_id')::uuid AND user_id = request.user_id())
    data:
      - SELECT * FROM tasks WHERE workspace_id = (bucket.active_id)::uuid AND deleted_at IS NULL
      - SELECT * FROM habit_logs WHERE workspace_id = (bucket.active_id)::uuid
      - SELECT * FROM task_tags WHERE workspace_id = (bucket.active_id)::uuid
      - SELECT * FROM comments WHERE workspace_id = (bucket.active_id)::uuid AND deleted_at IS NULL
      - SELECT * FROM attachments WHERE workspace_id = (bucket.active_id)::uuid AND deleted_at IS NULL
      - SELECT * FROM time_blocks WHERE workspace_id = (bucket.active_id)::uuid
      - SELECT * FROM focus_sessions WHERE workspace_id = (bucket.active_id)::uuid
