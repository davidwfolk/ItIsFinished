# ==============================================================================
# POWERSYNC SYNC RULES DEFINITION
# ==============================================================================
# Defines dynamic data streams replicating from Supabase PostgreSQL to client SQLite.

bucket_definitions:
  # 1. User Personal Stream (Profile, Time Blocks, Habits)
  user_personal:
    parameters: 
      - SELECT request.user_id() as current_user_id
    data:
      - SELECT * FROM profiles WHERE id = bucket.current_user_id
      - SELECT * FROM time_blocks WHERE user_id = bucket.current_user_id
      - SELECT * FROM focus_sessions WHERE user_id = bucket.current_user_id

  # 2. Workspaces Stream (All data belonging to Workspaces the user is a member of)
  workspaces_stream:
    parameters:
      - SELECT workspace_id FROM workspace_members WHERE user_id = request.user_id()
    data:
      - SELECT * FROM workspaces WHERE id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM workspace_members WHERE workspace_id = bucket.workspace_id
      - SELECT * FROM projects WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM sections WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM tasks WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM tags WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM habits WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT * FROM saved_filters WHERE workspace_id = bucket.workspace_id AND deleted_at IS NULL
      - SELECT habit_logs.* FROM habit_logs INNER JOIN habits ON habit_logs.habit_id = habits.id WHERE habits.workspace_id = bucket.workspace_id
      - SELECT task_tags.* FROM task_tags INNER JOIN tasks ON task_tags.task_id = tasks.id WHERE tasks.workspace_id = bucket.workspace_id
      - SELECT comments.* FROM comments INNER JOIN tasks ON comments.task_id = tasks.id WHERE tasks.workspace_id = bucket.workspace_id AND comments.deleted_at IS NULL
      - SELECT attachments.* FROM attachments INNER JOIN tasks ON attachments.task_id = tasks.id WHERE tasks.workspace_id = bucket.workspace_id AND attachments.deleted_at IS NULL
